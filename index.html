<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Raihanul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a0a;
        --bg-deep: #111111;
        --panel: #1b0d1a;
        --panel-2: #201016;
        --rose: #eeb7b0;
        --rose-strong: #f5a7b1;
        --rose-soft: #f3d4ca;
        --text: #f5ece9;
        --muted: #d9b9b8;
        --line: rgba(255, 255, 255, 0.14);
        --card: rgba(255, 255, 255, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: #000;
        color: var(--text);
        font-family: "Inter", sans-serif;
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1280px, calc(100% - 32px));
        margin: 0 auto;
      }

      .page {
        padding-bottom: 40px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(12, 8, 13, 0.45);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .topbar-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 62px;
      }

      .brand {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        line-height: 1.3;
        opacity: 0.9;
      }

      .nav {
        display: flex;
        gap: 28px;
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
      }

      .nav a {
        position: relative;
      }

      .nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 1px;
        background: var(--rose);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.35s ease;
      }

      .nav a:hover::after {
        transform: scaleX(1);
      }

      .hero {
        position: relative;
        background:
          radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.04), transparent 20%),
          linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.3)),
          #000;
        min-height: 760px;
        overflow: hidden;
        padding-top: 20px;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.02), transparent 20%),
          repeating-linear-gradient(
            135deg,
            rgba(255,255,255,0.01),
            rgba(255,255,255,0.01) 1px,
            transparent 1px,
            transparent 6px
          );
        pointer-events: none;
      }

      .hero-inner {
        position: relative;
        z-index: 1;
      }

      .hero-title-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 18px;
        z-index: 1;
      }

      .hero-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(11rem, 22vw, 30rem);
        line-height: 0.72;
        letter-spacing: -0.08em;
        font-weight: 800;
        color: var(--rose-soft);
        text-transform: uppercase;
        position: relative;
        display: inline-block;
        filter: drop-shadow(0 18px 18px rgba(0,0,0,0.25));
        animation: floatTitle 6s ease-in-out infinite alternate;
        z-index: 1;
      }

      .hero-title .line-break {
        display: block;
      }

      .hero-scribble {
        position: absolute;
        left: 8%;
        bottom: 18%;
        transform: rotate(-8deg);
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(1.8rem, 2vw, 3.2rem);
        line-height: 0.9;
        color: rgba(237, 198, 194, 0.9);
        text-shadow: 2px 2px 18px rgba(0,0,0,0.25);
        z-index: 2;
      }

      .hero-scribble strong {
        display: block;
        font-weight: 600;
      }

      .hero-visual {
        position: absolute;
        left: 50%;
        top: 110px;
        transform: translateX(-50%);
        z-index: 4;
        pointer-events: none;
      }

      .hero-visual img {
        width: min(640px, 52vw);
        height: auto;
        display: block;
        object-fit: contain;
        background: transparent;
        filter: drop-shadow(0 18px 25px rgba(0,0,0,0.45));
      }

      .hero-meta {
        position: absolute;
        right: 9%;
        bottom: 15%;
        width: min(260px, 26vw);
        z-index: 5;
        text-align: left;
      }

      .hero-meta h3 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.6rem);
        font-family: "Cormorant Garamond", serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text);
      }

      .hero-meta p {
        margin: 8px 0 0;
        color: rgba(255,255,255,0.8);
        font-size: 0.9rem;
        line-height: 1.7;
      }

      .hero-tag {
        position: absolute;
        right: 12%;
        top: 18%;
        transform: rotate(16deg);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
        border: 1px solid rgba(255,255,255,0.18);
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        z-index: 5;
      }

      .*
